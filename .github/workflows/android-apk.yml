name: 构建安卓超话采集助手
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - 'android-app.zip'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'
      - name: 编译 APK
        working-directory: android-app
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: chaohua-collector-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: 发布手机直装 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" chaohua-collector-v0.2.4.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest chaohua-collector-v0.2.4.apk --clobber
          else
            gh release create latest chaohua-collector-v0.2.4.apk --title "超话数据采集助手" --notes "小米手机安装包。首次安装后请按应用内提示开启无障碍服务并配置数据写入权限。" --latest
          fi
